<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141526"/>
      <stop offset="50%" stop-color="#0e0f19"/>
      <stop offset="100%" stop-color="#080910"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Neon Glow Gradient for M symbol -->
    <linearGradient id="mGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#6366f1"/>
      <stop offset="70%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Glass sheen -->
    <linearGradient id="glassSheen" x1="0%" y1="0%" x2="70%" y2="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with smooth bevel -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Glass sheen diagonal reflection -->
  <path d="M 24 128 C 24 70 70 24 128 24 L 384 24 C 442 24 488 70 488 128 L 488 200 L 24 360 Z" fill="url(#glassSheen)"/>

  <!-- Stylized MDJ "M" Logo (Left: Mermaid nodes, Right: Pen Nib) -->
  <g filter="url(#glow)">
    <!-- Main M stroke connecting Left stem, center dip, and right pen stem -->
    <path d="M 180 340 L 180 180 C 180 160 200 150 216 164 L 256 210 L 296 164 C 312 150 332 160 332 180 L 332 270"
          fill="none"
          stroke="url(#mGrad)"
          stroke-width="26"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Left side: Mermaid diagram interconnected graph nodes -->
    <line x1="180" y1="340" x2="136" y2="370" stroke="url(#mGrad)" stroke-width="14" stroke-linecap="round"/>
    <line x1="180" y1="280" x2="136" y2="370" stroke="url(#mGrad)" stroke-width="12" stroke-linecap="round"/>
    <line x1="180" y1="280" x2="136" y2="280" stroke="url(#mGrad)" stroke-width="12" stroke-linecap="round"/>

    <!-- Node 1 (Center bottom) -->
    <circle cx="180" cy="340" r="16" fill="#141526" stroke="#38bdf8" stroke-width="8"/>
    <!-- Node 2 (Left bottom) -->
    <circle cx="136" cy="370" r="18" fill="#141526" stroke="#38bdf8" stroke-width="8"/>
    <!-- Node 3 (Left middle) -->
    <circle cx="136" cy="280" r="14" fill="#141526" stroke="#6366f1" stroke-width="8"/>

    <!-- Right side: Pen Nib / Jot tip -->
    <!-- Nib Body -->
    <path d="M 314 270 L 350 270 L 364 330 L 332 380 L 300 330 Z"
          fill="#141526"
          stroke="url(#mGrad)"
          stroke-width="16"
          stroke-linejoin="round"/>

    <!-- Nib slit & breather hole -->
    <line x1="332" y1="330" x2="332" y2="376" stroke="#ec4899" stroke-width="6" stroke-linecap="round"/>
    <circle cx="332" cy="330" r="6" fill="#ec4899"/>
  </g>
</svg>